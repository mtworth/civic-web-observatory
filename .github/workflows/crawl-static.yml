# Daily crawl for the static (GH Pages) site — replaces the MotherDuck-
# writing crawl.yml, which is now schedule-disabled (see that file).
#
# Design: the daily slice logic (SHA-256(domain) % 90 == today % 90,
# identical to crawl.yml's) is a pure function of the date — it needs no
# prior state, so nothing here depends on reading yesterday's data before
# deciding what to crawl today. What *does* need continuity across runs is
# the accumulated observation history, handled by two artifacts with very
# different lifetimes:
#
#   1. Raw partitions — one small immutable Parquet file per crawl day,
#      committed to the `data` branch. ~500KB/day at current volume.
#      Committing new small immutable files is normal git growth, not the
#      "rewrite a big blob every day" bloat problem a single monolithic
#      committed file would cause.
#
#   2. Compacted snapshot — v_current.parquet, latest-per-domain,
#      recomputed from all partitions on every run and re-uploaded to the
#      `latest` GitHub Release with `--clobber`. Release assets aren't
#      part of git history, so this file is fully replaced every day
#      forever without the repo growing from it. The static site fetches
#      that same stable release URL, so GH Pages itself only needs to
#      redeploy when the *app* changes, not when the *data* changes.

name: Daily Crawl (static)

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write  # push to the data branch, upload release assets

concurrency:
  group: crawl-static
  cancel-in-progress: false  # never overlap two crawl runs against the same data branch

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
          enable-cache: true
      - run: uv sync

      # Identical slicing to crawl.yml — pure function of today's date.
      - name: Slice today's domains
        run: |
          python3 - <<'EOF'
          import csv, hashlib, datetime

          with open('data/seed_domains.csv', newline='') as f:
              reader = csv.DictReader(f)
              fieldnames = reader.fieldnames
              bucket = datetime.date.today().toordinal() % 90
              rows = [
                  r for r in reader
                  if int(hashlib.sha256(r['domain'].encode()).hexdigest(), 16) % 90 == bucket
              ]

          with open('/tmp/daily_slice.csv', 'w', newline='') as f:
              writer = csv.DictWriter(f, fieldnames=fieldnames)
              writer.writeheader()
              writer.writerows(rows)

          print(f"Domains in slice: {len(rows):,}")
          EOF

      - name: Download GeoLite2-ASN database
        run: uv run pwo download-geoip
        env:
          MAXMIND_LICENSE_KEY: ${{ secrets.MAXMIND_LICENSE_KEY }}

      # No MOTHERDUCK_TOKEN — --out-parquet writes straight to a file,
      # never opens a database connection.
      - name: Crawl today's slice
        run: |
          uv run pwo crawl /tmp/daily_slice.csv --concurrency 25 --timeout 10 \
            --out-parquet /tmp/partition.parquet

      - name: Commit today's partition to the data branch
        run: |
          git fetch origin data
          git worktree add /tmp/data-branch origin/data
          mkdir -p /tmp/data-branch/observations
          cp /tmp/partition.parquet "/tmp/data-branch/observations/$(date +%F).parquet"
          cd /tmp/data-branch
          git add "observations/$(date +%F).parquet"
          git -c user.name="crawl-bot" -c user.email="crawl-bot@users.noreply.github.com" \
            commit -m "observations: $(date +%F)"
          git push origin HEAD:data

      # site/compact.py's --partitions-dir/--out-dir point it at the
      # checked-out data branch instead of its local-dev default (site/data).
      - name: Compact all partitions into v_current
        run: |
          uv run python site/compact.py \
            --partitions-dir /tmp/data-branch/observations \
            --out-dir /tmp/compacted

      - name: Publish snapshot as a GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload latest /tmp/compacted/v_current.parquet /tmp/compacted/tech_top.json --clobber

  # A separate, much less frequent job (weekly/monthly, not shown) would
  # roll up old daily partitions into fewer larger monthly files once the
  # partition count grows into the hundreds — not urgent yet, but worth
  # revisiting after ~6-12 months of continuous crawling so `git clone`
  # doesn't have to pull thousands of tiny files.
