<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">Insights — Civic Web Observatory</title>
<meta name="description" id="page-description" content="">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="static/style.css">
<script src="https://cdn.jsdelivr.net/npm/marked@4.3.0/marked.min.js"></script>
</head>
<body>

<header class="site-header">
  <a class="wordmark" href="index.html">Civic Web Observatory</a>
  <nav aria-label="Primary">
    <ul class="site-nav">
      <li><a href="explore.html">Explore</a></li>
      <li><a href="insights.html" class="active" aria-current="page">Insights</a></li>
      <li><a href="about.html">About</a></li>
    </ul>
  </nav>
</header>
<hr class="header-rule">

<main>
<div class="methods-body">
  <a class="domain-back" href="insights.html">&larr; Back to insights</a>
  <p id="not-found" hidden style="margin-top:1.5rem; color:var(--gray-3)">Post not found.</p>

  <div id="skeleton-body" style="margin-top:1.5rem">
    <div class="skel" style="height:11px; width:80px; margin-bottom:1rem;"></div>
    <div class="skel" style="height:24px; width:60%; margin-bottom:1.5rem;"></div>
    <div class="skel" style="height:14px; margin-bottom:.6rem;"></div>
    <div class="skel" style="height:14px; margin-bottom:.6rem;"></div>
    <div class="skel" style="height:14px; width:80%;"></div>
  </div>

  <div id="post-body" hidden>
    <div class="report-date" id="post-date" style="margin-top:1.5rem"></div>
    <h2 id="post-title"></h2>
    <div class="report-body" id="post-content"></div>
  </div>
</div>
</main>

<footer class="site-footer">
  <span class="footer-copy">Civic Web Observatory</span>
</footer>

<script type="module">
import { fetchPost } from "./static/insights-client.js";

const params = new URLSearchParams(location.search);
const slug = params.get("slug");

async function main() {
  if (!slug) {
    document.getElementById("skeleton-body").hidden = true;
    document.getElementById("not-found").hidden = false;
    document.getElementById("not-found").textContent = "No post specified — append ?slug=some-post to the URL.";
    return;
  }

  const post = await fetchPost(slug);
  if (!post) {
    document.getElementById("skeleton-body").hidden = true;
    document.getElementById("not-found").hidden = false;
    return;
  }

  document.getElementById("page-title").textContent = `${post.title} — Civic Web Observatory`;
  document.getElementById("page-description").setAttribute("content", post.summary);
  document.getElementById("post-date").textContent = post.date;
  document.getElementById("post-title").textContent = post.title;
  document.getElementById("post-content").innerHTML = marked.parse(post.bodyMarkdown);
  document.getElementById("skeleton-body").hidden = true;
  const postBody = document.getElementById("post-body");
  postBody.hidden = false;
  postBody.classList.add("fade-in");
}

main().catch((err) => {
  console.error(err);
});
</script>

</body>
</html>
