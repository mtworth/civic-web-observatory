<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">Insights — Civic Web Index static prototype</title>
<meta name="description" id="page-description" content="">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="static/style.css">
<script src="https://cdn.jsdelivr.net/npm/marked@4.3.0/marked.min.js"></script>
<style>
  .proto-banner {
    background: #fff8e1; border-bottom: 1px solid var(--gray-2);
    font-size: 12px; padding: 6px 24px; color: var(--gray-4);
  }
</style>
</head>
<body>

<div class="proto-banner">Static prototype — this post is fetched and rendered from a plain .md file in your browser. <span id="load-status">Loading…</span></div>

<header class="site-header">
  <a class="wordmark" href="index.html">Civic Web Index</a>
  <nav aria-label="Primary">
    <ul class="site-nav">
      <li><a href="explore.html">Explore</a></li>
      <li><a href="insights.html" class="active" aria-current="page">Insights</a></li>
      <li><a href="#" aria-disabled="true" title="Not mirrored in this prototype">About</a></li>
    </ul>
  </nav>
</header>
<hr class="header-rule">

<main>
<div class="methods-body">
  <a class="domain-back" href="insights.html">&larr; Back to insights</a>
  <p id="not-found" hidden style="margin-top:1.5rem; color:var(--gray-3)">Post not found.</p>

  <div id="post-body" hidden>
    <div class="report-date" id="post-date" style="margin-top:1.5rem"></div>
    <h2 id="post-title"></h2>
    <div class="report-body" id="post-content"></div>
  </div>
</div>
</main>

<footer class="site-footer">
  <span class="footer-copy">testmigration prototype &middot; mirrors civicwebindex.org</span>
  <ul class="footer-links">
    <li><a href="README.md">README</a></li>
  </ul>
</footer>

<script type="module">
import { fetchPost } from "./static/insights-client.js";

const loadStatus = document.getElementById("load-status");
const params = new URLSearchParams(location.search);
const slug = params.get("slug");

async function main() {
  if (!slug) {
    loadStatus.textContent = "No post specified — append ?slug=some-post to the URL.";
    document.getElementById("not-found").hidden = false;
    document.getElementById("not-found").textContent = "No post specified — append ?slug=some-post to the URL.";
    return;
  }

  const post = await fetchPost(slug);
  if (!post) {
    loadStatus.textContent = `Failed to load: no post found for "${slug}".`;
    document.getElementById("not-found").hidden = false;
    return;
  }

  document.getElementById("page-title").textContent = `${post.title} — Civic Web Index static prototype`;
  document.getElementById("page-description").setAttribute("content", post.summary);
  document.getElementById("post-date").textContent = post.date;
  document.getElementById("post-title").textContent = post.title;
  document.getElementById("post-content").innerHTML = marked.parse(post.bodyMarkdown);
  document.getElementById("post-body").hidden = false;
  loadStatus.textContent = "Loaded post.";
}

main().catch((err) => {
  console.error(err);
  loadStatus.textContent = `Failed to load: ${err.message}`;
});
</script>

</body>
</html>
