<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Insights — Civic Web Index</title>
<meta name="description" content="Analysis and thought leadership on the digital infrastructure of the American civic web.">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="static/style.css">
</head>
<body>

<header class="site-header">
  <a class="wordmark" href="index.html">Civic Web Index</a>
  <nav aria-label="Primary">
    <ul class="site-nav">
      <li><a href="explore.html">Explore</a></li>
      <li><a href="insights.html" class="active" aria-current="page">Insights</a></li>
      <li><a href="#" aria-disabled="true" title="Coming soon">About</a></li>
    </ul>
  </nav>
</header>
<hr class="header-rule">

<main>
<div class="methods-body">
  <h2>Insights</h2>
  <p>Analysis and thought leadership on the digital infrastructure of the American civic web &mdash; written, not generated. For live filtering, see <a href="explore.html" style="color:var(--black)">Explore</a>.</p>

  <div class="report-list" id="post-list">
    <div class="skel" style="height:70px; margin:1.25rem 0;"></div>
    <div class="skel" style="height:70px; margin:1.25rem 0;"></div>
  </div>
</div>
</main>

<footer class="site-footer">
  <span class="footer-copy">civicwebindex.org</span>
</footer>

<script type="module">
import { fetchAllPosts } from "./static/insights-client.js";

const postList = document.getElementById("post-list");

async function main() {
  const posts = await fetchAllPosts();

  if (!posts.length) {
    postList.innerHTML = `<p style="color:var(--gray-3)">No posts published yet.</p>`;
    return;
  }

  postList.innerHTML = posts.map((p) => `
    <a class="report-card fade-in" href="insights-post.html?slug=${encodeURIComponent(p.slug)}">
      <div class="report-date">${p.date}</div>
      <div class="report-title">${p.title}</div>
      <div class="report-summary">${p.summary}</div>
    </a>
  `).join("");
}

main().catch((err) => {
  console.error(err);
});
</script>

</body>
</html>
