[project]
name = "public-web-observatory"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx[http2]",
    "beautifulsoup4",
    "lxml",
    "dnspython",
    "ipwhois",
    "cryptography",
    "duckdb",
    "pydantic",
    "tenacity",
    "click",
    "rich",
    "fastapi",
    "jinja2",
    "uvicorn[standard]",
    "pytz",
    "geoip2>=5.2.0",
    "markdown",
]

[project.scripts]
pwo = "pwo.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pwo"]

[dependency-groups]
test = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
